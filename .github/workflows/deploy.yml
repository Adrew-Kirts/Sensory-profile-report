name: Deploy to Production

on:
  push:
    branches: [ prod ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: "25m"
          script: |
            # Go to project directory
            cd /opt/spr_project

            # Backup current .env
            cp .env .env.backup || true

            # Force-sync working tree to origin/prod, discarding any local
            # mutations made by previous composer/npm builds or stray edits.
            git fetch origin prod
            git reset --hard origin/prod
            git clean -fd -e .env -e .env.backup -e public/build -e var

            # Restore .env
            mv .env.backup .env

            # Rebuild and restart app container
            docker-compose build app
            docker-compose stop app
            docker-compose up -d app
            
            # Rebuild frontend assets (bind mount overlays the image-built assets)
            docker exec spr_app npm run build

            # Clear cache and run migrations
            docker exec spr_app php bin/console cache:clear
            docker exec spr_app php bin/console doctrine:migrations:migrate --no-interaction

            # Set proper permissions
            docker exec spr_app chown -R www-data:www-data var/ public/build/

            # Clear opcache (alternative method)
            docker exec spr_app php -r "opcache_reset();" || true